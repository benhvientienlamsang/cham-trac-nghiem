<style>

:root {
  --bg: #eef1f4; --surface: #ffffff; --ink: #14202c; --muted: #5a6876; --line: #d6dde4;
  --accent: #2449b8; --accent-ink: #ffffff; --accent-soft: #e3e9f8;
  --ok: #1d7f47; --ok-soft: #dcf1e4; --bad: #c0352b; --bad-soft: #fbe3e0; --warn: #9a6a0c; --warn-soft: #fbefd4;
  --graphite: #2b2f33;
  --f-ui: 'Be Vietnam Pro', 'Segoe UI', Roboto, Arial, sans-serif;
  --f-mono: 'IBM Plex Mono', 'Roboto Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1318; --surface: #161d24; --ink: #e5eaef; --muted: #96a3b0; --line: #2a3541;
  --accent: #86a2ff; --accent-ink: #0b1220; --accent-soft: #1c2742;
  --ok: #5ccb8b; --ok-soft: #133524; --bad: #ff8478; --bad-soft: #3a1a17; --warn: #e8b553; --warn-soft: #362a10; --graphite: #d7dce1; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1318; --surface: #161d24; --ink: #e5eaef; --muted: #96a3b0; --line: #2a3541;
  --accent: #86a2ff; --accent-ink: #0b1220; --accent-soft: #1c2742;
  --ok: #5ccb8b; --ok-soft: #133524; --bad: #ff8478; --bad-soft: #3a1a17; --warn: #e8b553; --warn-soft: #362a10; --graphite: #d7dce1; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; padding-block: 12px 8px; }
.mark { width: 34px; height: 34px; flex: none; }
.brand .t { min-width: 0; flex: 1; }
#examName { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#examMeta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#examMeta { color: var(--muted); font-size: 12.5px; }
#storeChip { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
#storeChip[data-mode="db"] { color: var(--ok); border-color: currentColor; }
nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 4px 9px; font: 600 14px var(--f-ui); color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
main { padding-block: 16px 48px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack > * { margin: 0; min-width: 0; }
h1 { font-size: 22px; line-height: 1.25; text-wrap: balance; }
h2 { font-size: 18px; text-wrap: balance; }
h3 { font-size: 15.5px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.hero h1 { font-size: 24px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0; }
textarea { resize: vertical; }
input[type="range"] { padding: 0; background: none; border: 0; accent-color: var(--accent); }
input:focus-visible, select:focus-visible, textarea:focus-visible, .btn:focus-visible, .tab:focus-visible, .q:focus-visible, .icon:focus-visible, .disclose:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 500; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 14.5px var(--f-ui); padding: 10px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-align: center; min-height: 44px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: 13.5px; }
.btn.big { min-height: 64px; font-size: 16px; flex: 1; }
.btn.big svg { width: 26px; height: 26px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.danger-text { color: var(--bad) !important; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.capture { display: flex; gap: 10px; flex-wrap: wrap; }
.capture .wide { flex-basis: 100%; }
.credit { font-size: 12px; font-weight: 600; letter-spacing: .01em; color: var(--accent); line-height: 1.35; }
.credit b { font-weight: 700; }
.credit span, .credit b { white-space: nowrap; }
.foot { padding-block: 0 32px; text-align: center; font-size: 12.5px; color: var(--muted); }
.foot b { color: var(--ink); font-weight: 600; }
body.noscroll { overflow: hidden; }
.fileready { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 41; display: flex; align-items: center; gap: 10px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 14px; box-shadow: 0 8px 28px rgba(0,0,0,.18); width: min(92vw, 520px); font-size: 14px; }
.fileready span { flex: 1; min-width: 0; overflow-wrap: anywhere; }

#live { position: fixed; inset: 0; z-index: 30; background: #000; color: #fff; }
#livePreview, #liveOverlay { position: absolute; inset: 0; width: 100%; height: 100%; }
.camsrc { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0.01; pointer-events: none; z-index: -1; }
#livePreview { background: #000; }
.livebar { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
.livebar.top { top: 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 10px; background: linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,0)); }
.livebar.bot { bottom: 0; flex-direction: column; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-top: 28px; background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.75)); }
#liveExam { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.livebtn { appearance: none; border: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.35); color: #fff; border-radius: 999px; min-width: 44px; height: 44px; padding: 0 14px; font: 600 14px var(--f-ui); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.livebtn[aria-pressed="true"] { background: #f6d32d; color: #111; border-color: #f6d32d; }
#liveStatus { font-weight: 600; font-size: 15px; text-align: center; text-wrap: balance; min-height: 2.6em; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
#liveStatus[data-kind="ok"] { color: #8ff0a4; }
#liveStatus[data-kind="bad"] { color: #ffb3a7; }
.liverow { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 520px; gap: 12px; }
.shutter { appearance: none; width: 72px; height: 72px; border-radius: 50%; border: 4px solid #fff; background: rgba(255,255,255,.25); cursor: pointer; flex: none; }
.shutter:active { background: rgba(255,255,255,.6); }
.livecheck { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; max-width: 9.5em; line-height: 1.25; }
.livecheck input { width: 22px; height: 22px; accent-color: #33d17a; flex: none; }
#liveFlash { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(29,127,71,.92); color: #fff; padding: 14px 20px; border-radius: 10px; font-weight: 700; font-size: 16px; text-align: center; max-width: 86vw; }
.livecard { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.45); max-width: 520px; margin: 0 auto; }
.lc-top { display: flex; align-items: center; gap: 14px; }
.lc-score { font: 700 38px/1 var(--f-ui); font-variant-numeric: tabular-nums; }
.lc-score small { font-size: 16px; color: var(--muted); margin-left: 2px; }
.lc-meta { font-size: 14px; line-height: 1.5; color: var(--muted); }
.lc-meta b { color: var(--ink); }
.lc-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.lc-actions .btn { flex: 1 1 auto; }
.livebtn:focus-visible, .shutter:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions.inline { flex-wrap: nowrap; }
.icon { appearance: none; border: 0; background: none; color: var(--muted); font-size: 22px; width: 40px; height: 40px; border-radius: 8px; cursor: pointer; flex: none; }
.note { border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.note:not(.warn) { background: var(--ok-soft); border-left: 3px solid var(--ok); }
.note.warn { background: var(--warn-soft); color: var(--ink); border-left: 3px solid var(--warn); }
.busy { color: var(--accent); font-weight: 600; }
.busy::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; margin-right: 8px; vertical-align: -1px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.tips ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.tips li { padding-left: 16px; position: relative; color: var(--muted); }
ul.tips { list-style: none; padding-left: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.tips li::before { content: "-"; position: absolute; left: 0; color: var(--ink); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.info { background: var(--accent-soft); color: var(--accent); }


.scoreline { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.score { font: 700 44px/1 var(--f-ui); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.score small { font-size: 18px; color: var(--muted); font-weight: 600; margin-left: 4px; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12.5px; color: var(--muted); }
.legend .q { width: 22px; height: 22px; min-height: 0; pointer-events: none; display: inline-flex; }
.legend .q .qa { font-size: 11px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
.q { position: relative; appearance: none; display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; font-family: var(--f-mono); padding: 0 4px; }
.q .qn { font-size: 10.5px; color: var(--muted); position: absolute; top: 2px; left: 5px; }
.q .qa { font-size: 16px; font-weight: 600; margin-top: 6px; }
.q .qk { position: absolute; right: 4px; top: 2px; font-size: 10.5px; color: var(--ok); font-weight: 600; }
.q.ok { background: var(--ok-soft); border-color: var(--ok); }
.q.ok .qa { color: var(--ok); }
.q.bad { background: var(--bad-soft); border-color: var(--bad); }
.q.bad .qa { color: var(--bad); }
.q.blank, .q.multi { background: var(--warn-soft); border-color: var(--warn); border-style: dashed; }
.q.faint { box-shadow: inset 0 0 0 2px var(--warn); }
.imgbox summary { cursor: pointer; font-weight: 600; color: var(--accent); padding-block: 4px; }
.sheetHost { margin-top: 10px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
.sheetHost canvas { display: block; width: 100%; height: auto; }


.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stats div { display: flex; flex-direction: column; }
.stats b { font-size: 24px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12px; color: var(--muted); }
.hist { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; height: 90px; align-items: end; border-bottom: 1px solid var(--line); }
.hist .bar { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.hist i { display: block; width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 0; opacity: .85; }
.hist span { position: absolute; bottom: 2px; font-size: 11px; color: var(--accent-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.histx { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -6px; }
.reslist, .keylist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.res, .key { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding-block: 8px; }
.res:first-child, .key:first-child { border-top: 0; }
.rmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; cursor: pointer; }
.rinfo { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.rmain .sid { font-weight: 600; }
.rmain .code { color: var(--muted); font-size: 13px; }
